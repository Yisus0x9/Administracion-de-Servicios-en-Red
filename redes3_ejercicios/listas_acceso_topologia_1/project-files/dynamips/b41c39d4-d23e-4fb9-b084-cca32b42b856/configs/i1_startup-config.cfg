!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 10.10.10.14 255.255.255.252
 duplex half
!
interface FastEthernet1/0
 ip address 192.168.3.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet1/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet2/0
 ip address 10.10.10.17 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet2/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet3/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet4/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet5/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet6/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet6/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
!
router eigrp 900
 passive-interface FastEthernet1/0
 network 10.10.10.12 0.0.0.3
 network 10.10.10.16 0.0.0.3
 network 192.168.3.0
 no auto-summary
!
router ospf 1
 log-adjacency-changes
 network 10.10.10.0 0.0.0.3 area 0
 network 10.10.10.4 0.0.0.3 area 1
 network 10.10.10.12 0.0.0.3 area 1
 network 10.10.10.16 0.0.0.3 area 2
 network 192.168.1.0 0.0.0.255 area 1
 network 192.168.3.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
!
access-list 5 deny   192.168.1.10
access-list 5 deny   192.168.3.0 0.0.0.255
access-list 5 permit any
access-list 6 permit 192.168.1.16
access-list 6 permit 192.168.3.0 0.0.0.255
access-list 6 deny   any
access-list 7 permit 192.168.1.16
access-list 7 permit 192.168.1.0 0.0.0.255
access-list 7 deny   any
access-list 115 permit ip host 192.168.1.12 192.168.3.0 0.0.0.255
access-list 115 deny   ip 192.168.1.0 0.0.0.255 192.168.3.0 0.0.0.255
access-list 115 permit ip any any
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
